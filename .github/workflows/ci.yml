# CI: typecheck (tsc checkJs against the real dsh closure) + tests + a
# real-host boot smoke, on every push to main and every pull request.
#
# The dsh host line is the ROLLING ALPHA TAG (`dsh@alpha`), never hand-pinned —
# dsh-dcp targets the alpha line, and a hand-pinned version rots (the rc.8
# lesson from dsh-cron). The closure linker re-points every
# `node_modules/@deepseek-ai/*` entry at the installed CLI's own packages so
# typecheck and tests run against exactly ONE copy of the host graph.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & Test (dsh alpha closure)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The shipped engines floor plus current LTS.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # pnpm-lock.yaml is committed and MUST be regenerated in the same
          # commit as any package.json change — CI installs frozen and fails
          # fast otherwise (the dsh-tui-pi v1.0.5 lesson).
          version: 10

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (rolling alpha line)
        run: npm install -g @deepseek-ai/dsh@alpha --no-audit --no-fund

      - name: Link the dsh closure over the installed @deepseek-ai packages
        run: node scripts/link-dsh-closure.mjs

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

  smoke:
    name: Boot smoke (real dsh host)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dsh CLI (rolling alpha line)
        run: npm install -g @deepseek-ai/dsh@alpha --no-audit --no-fund

      # Packs the repo, mounts it into a scratch profile through the
      # cordis.patch.yml layer (scripts/setup.mjs mechanism), and boots the
      # real host under a timeout. Needs no repo node_modules.
      - name: Boot smoke (npm pack → scratch profile → real boot)
        run: node scripts/smoke-boot.mjs
